# Fetches the season from the NHL API, builds the static site, and deploys it to GitHub Pages.
# If the fetch script's data checks fail, nothing is deployed and the live site keeps the last good table.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily at 08:00 UTC (4 AM Eastern in summer time, 3 AM in winter), after the previous night's games have finished.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fetch-games
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
